services:
  # 1. FastAPI Python Backend Service
  - type: web
    name: silentguard-backend
    env: python
    plan: free
    rootDir: spyware_detection_project
    buildCommand: pip install -r requirements_universal.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5

  # 2. Next.js App Router Node Frontend Service
  - type: web
    name: silentguard-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: host
          name: silentguard-backend
